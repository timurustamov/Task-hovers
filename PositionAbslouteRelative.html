<!DOCTYPE html>

<html lang="en">


<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Position Absolute and Relative </title>

<style>

body{
padding-bottom: 2000px;

}




.Task1{
position: absolute;
top: 0px;
left: 10px;
font-family: Arial, Helvetica, sans-serif;
background-color: black;
color: white;
padding-left: 8px;
padding-right: 8px;
padding-top: 4px;
padding-bottom: 4px;
border-radius: 15px;


}



.Task2{
width: 320px;
height: 180px;
background-color: gray;
position: fixed;
bottom: 20px;
right: 20px;
font-family: Arial, Helvetica, sans-serif;
text-align: center;

}



.Urrus{
background-color: aqua;
position: absolute;
right: 20px;
top: 0;
bottom: 20px;
font-family: Arial, Helvetica, sans-serif;


}




.TaskInside{
position: absolute;
top: -12px;
left: -10px;
font-family: Arial, Helvetica, sans-serif;
background-color: black;
color: white;
padding-left: 8px;
padding-right: 8px;
padding-top: 4px;
padding-bottom: 4px;
border-radius: 15px;



}







.Task4{
width: 300px;
height: 150px;
background-color: gray;
position: relative;
margin-top: 100px;

}



.Iks{
background-color: black;
color: white;
font-family: Arial, Helvetica, sans-serif;
position: absolute;
left: -12px;
top: -12px;
padding-left: 8px;
padding-right: 8px;
padding-top: 4px;
padding-bottom: 4px;
border-radius: 15px;



}






.Time{
background-color: black;
color: white;
position: absolute;
right: 10px;
bottom: 10px;

}







.ClotheDiv1{
position: relative;
background-color: rgb(207, 207, 207);
width: 250px;
height: 270px;
margin-top: 50px;
text-align: center;

}



.Jacket{
width: 250px;
height: 250px;


}


.Discount{
position: absolute;
top: 10px;
right: 0;
background-color: black;
color: white;
font-family: Arial, Helvetica, sans-serif;
padding-top: 5px;
padding-bottom: 5px;
width: 100px;


}











.LastTask{
position: relative;
width: 320px;
height: 300px;
background-color: rgb(206, 204, 204);
margin-top: 50px;
text-align: center;


}




.Palto2{
width: 270px;
height: 280px;


}



.Discount2{
position: absolute;
top: 0;
right: 0;
background-color: black;
color: white;
padding-top: 5px;
padding-bottom: 5px;
padding-left: 5px;
padding-right: 5px;
font-family: Arial, Helvetica, sans-serif;


}




.Shadow{
position: absolute;
bottom: 0;  
display: flex;
align-items: center;
justify-content: center;
height: 90px;
width: 320px;
background-color:rgba(255, 253, 253, 0.8) ;


}   




.Button{
height: 30px;
padding-left: 10px;
padding-right: 10px;
background-color: white;
border-style: solid;
font-family: Arial, Helvetica, sans-serif;


}




</style>





</head>


<body>
  


<div class="Task1">X </div>


<div class="Task2"> Tima  
<div class="TaskInside">X </div>

<div class="Urrus"> Urrus </div> 

</div>






<div class="Task4">

<div class="Iks"> X</div>  
<div class="Time"> 0:29  </div>

</div>





<div class="ClotheDiv1">
<img class="Jacket" src="Images/background-remover-1791533622753.png" alt="">

<div class="Discount">20% OFF</div>


</div>







<div class="LastTask">

<img class="Palto2" src="Images/background-remover-1791533622753.png" alt="">

<div class="Discount2"> 20% OFF  </div>

<div class="Shadow">
<button class="Button"> Add To Cart</button>
</div>


</div>







</body>



</html>
